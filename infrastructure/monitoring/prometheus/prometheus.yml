global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: 'prod'

scrape_configs:
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    authorization:
      credentials_file: '/var/run/secrets/kubernetes.io/serviceaccount/token'
    tls_config:
      ca_file: '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
        action: keep
        regex: default;execution-engine

  - job_name: 'fix-sessions'
    static_configs:
      - targets: ['fix1.quantum:9876', 'fix2.quantum:9876']
    metrics_path: '/fix-metrics'
    scheme: 'http'

remote_write:
  - url: "https://thanos.quantum.prod/api/v1/receive"
    queue_config:
      max_samples_per_send: 10000
      capacity: 200000
      max_shards: 100